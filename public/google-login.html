<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #202124;
      color: #e8eaed;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      box-sizing: border-box;
      padding: 10px;
    }
    .card {
      background-color: #2d2e30;
      border: 1px solid #3c4043;
      border-radius: 8px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      text-align: center;
      box-sizing: border-box;
    }
    .logo {
      height: 24px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 400;
      margin: 0 0 8px 0;
      color: #fff;
    }
    p {
      font-size: 14px;
      color: #9aa0a6;
      margin: 0 0 24px 0;
    }
    .accounts-container {
      margin-bottom: 20px;
      max-height: 160px;
      overflow-y: auto;
      border: 1px solid #3c4043;
      border-radius: 6px;
    }
    .account-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #3c4043;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.2s;
    }
    .account-item:last-child {
      border-bottom: none;
    }
    .account-item:hover {
      background-color: #35363a;
    }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #8ab4f8;
      color: #202124;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-size: 16px;
      flex-shrink: 0;
    }
    .details {
      flex-grow: 1;
      min-width: 0;
    }
    .name {
      font-size: 14px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .email {
      font-size: 12px;
      color: #9aa0a6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .input-field {
      width: 100%;
      padding: 10px 12px;
      margin-top: 10px;
      box-sizing: border-box;
      border: 1px solid #5f6368;
      border-radius: 4px;
      background-color: transparent;
      color: white;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #8ab4f8;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      margin-top: 16px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #9ec2f9;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
    </svg>
    <h1>Choose an account</h1>
    <p>to continue to Kilo AI Chat Hub</p>
    
    <div class="accounts-container" id="accounts-list">
      <div class="account-item" onclick="selectAccount('paid@kilo.ai', 'Ankit Paid')">
        <div class="avatar" style="background-color: #f28b82;">P</div>
        <div class="details">
          <div class="name">Ankit Paid (Monthly)</div>
          <div class="email">paid@kilo.ai</div>
        </div>
      </div>
      <div class="account-item" onclick="selectAccount('free@kilo.ai', 'Ankit Free')">
        <div class="avatar" style="background-color: #ccff90;">F</div>
        <div class="details">
          <div class="name">Ankit Free</div>
          <div class="email">free@kilo.ai</div>
        </div>
      </div>
      <div class="account-item" onclick="selectAccount('unlimit@kilo.ai', 'Ankit Unlimited')">
        <div class="avatar" style="background-color: #c5a5fc;">U</div>
        <div class="details">
          <div class="name">Ankit Unlimited</div>
          <div class="email">unlimit@kilo.ai</div>
        </div>
      </div>
    </div>
    
    <div style="margin-top: 15px; border-top: 1px solid #3c4043; padding-top: 15px;">
      <div style="font-size: 13px; text-align: left; margin-bottom: 5px; color: #9aa0a6;">Use another account:</div>
      <input type="email" id="custom-email" class="input-field" placeholder="Email address" required>
      <input type="text" id="custom-name" class="input-field" placeholder="Full name (optional)">
      <button class="btn" onclick="submitCustom()">Sign in</button>
    </div>
  </div>

  <script>
    function selectAccount(email, name) {
      if (window.opener) {
        window.opener.postMessage({
          type: 'GOOGLE_SIGN_IN_SUCCESS',
          email: email,
          name: name
        }, '*');
      }
      window.close();
    }
    
    function submitCustom() {
      const email = document.getElementById('custom-email').value.trim();
      let name = document.getElementById('custom-name').value.trim();
      if (!email) {
        alert('Please enter an email address.');
        return;
      }
      if (!email.includes('@')) {
        alert('Please enter a valid email address.');
        return;
      }
      if (!name) {
        name = email.split('@')[0];
        name = name.charAt(0).toUpperCase() + name.slice(1);
      }
      selectAccount(email, name);
    }
  </script>
</body>
</html>
